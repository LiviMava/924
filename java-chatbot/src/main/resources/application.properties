spring.application.name=company-knowledge
server.address=${RAG_BIND_ADDRESS:127.0.0.1}
server.port=${RAG_PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.location=${RAG_DATA_DIR:./.runtime/data}/tmp
spring.datasource.url=${RAG_JDBC_URL:jdbc:h2:file:./.runtime/data/metadata;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${RAG_DB_USER:sa}
spring.datasource.password=${RAG_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
rag.data-dir=${RAG_DATA_DIR:./.runtime/data}
rag.api-key=${RAG_API_KEY:}
rag.legacy-chat-enabled=false
rag.chat.base-url=${RAG_CHAT_BASE_URL:https://api.deepseek.com}
rag.chat.api-key=${RAG_CHAT_API_KEY:${DEEPSEEK_API_KEY:}}
rag.chat.model=${RAG_CHAT_MODEL:deepseek-flash}
rag.embedding.base-url=${RAG_EMBEDDING_BASE_URL:}
rag.embedding.api-key=${RAG_EMBEDDING_API_KEY:}
rag.embedding.model=${RAG_EMBEDDING_MODEL:}
rag.embedding.dimensions=${RAG_EMBEDDING_DIMENSIONS:1024}
rag.qdrant.host=${RAG_QDRANT_HOST:127.0.0.1}
rag.qdrant.grpc-port=${RAG_QDRANT_GRPC_PORT:6334}
rag.qdrant.http-url=${RAG_QDRANT_URL:http://127.0.0.1:6333}
rag.qdrant.api-key=${RAG_QDRANT_API_KEY:}
rag.qdrant.use-tls=${RAG_QDRANT_TLS:false}
rag.qdrant.collection=${RAG_QDRANT_COLLECTION:company_chunks_v1}
rag.retrieval.candidates=30
rag.retrieval.top-k=6
rag.retrieval.min-vector-score=${RAG_MIN_VECTOR_SCORE:0.45}
rag.retrieval.rerank-url=${RAG_RERANK_URL:}
rag.retrieval.rerank-api-key=${RAG_RERANK_API_KEY:}
rag.retrieval.rerank-model=${RAG_RERANK_MODEL:}
rag.retrieval.rerank-mode=${RAG_RERANK_MODE:http}
rag.retrieval.rerank-raw-scores=${RAG_RERANK_RAW_SCORES:false}
rag.mcp.enabled=${RAG_MCP_ENABLED:false}
rag.mcp.url=${RAG_MCP_URL:http://127.0.0.1:8765/mcp}
rag.mcp.api-key=${NX_MCP_API_KEY:}
rag.mcp.timeout-seconds=30
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
rag.tutorial.enabled=${RAG_TUTORIAL_ENABLED:false}
rag.ingestion.batch-size=${RAG_EMBEDDING_BATCH_SIZE:16}
rag.tutorial.corpus-dir=${RAG_HANDBOOK_DIR:./.runtime/handbooks}
