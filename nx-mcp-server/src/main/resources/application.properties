spring.application.name=nx-mcp-server
server.address=127.0.0.1
server.port=${NX_MCP_PORT:8765}
server.shutdown=graceful
spring.ai.mcp.server.name=company-nx
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.annotation-scanner.enabled=false
management.endpoints.web.exposure.include=health
nx.bridge-dir=${NX_BRIDGE_DIR:./.runtime/nx-bridge}
nx.bridge-timeout-seconds=20
nx.mcp-api-key=${NX_MCP_API_KEY:}
nx.backend=${NX_BACKEND:bridge}
